packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@node-rs/argon2': true
  prisma: true
  argon2: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@types/node@26.5.0'
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - typescript-eslint@8.70.0
  - zod@4.6.1
  - '@node-rs/argon2-android-arm-eabi@2.2.1'
  - '@node-rs/argon2-android-arm64@2.2.1'
  - '@node-rs/argon2-darwin-arm64@2.2.1'
  - '@node-rs/argon2-darwin-x64@2.2.1'
  - '@node-rs/argon2-freebsd-x64@2.2.1'
  - '@node-rs/argon2-linux-arm-gnueabihf@2.2.1'
  - '@node-rs/argon2-linux-arm64-gnu@2.2.1'
  - '@node-rs/argon2-linux-arm64-musl@2.2.1'
  - '@node-rs/argon2-linux-x64-gnu@2.2.1'
  - '@node-rs/argon2-linux-x64-musl@2.2.1'
  - '@node-rs/argon2-win32-arm64-msvc@2.2.1'
  - '@node-rs/argon2-win32-ia32-msvc@2.2.1'
  - '@node-rs/argon2-win32-x64-msvc@2.2.1'
  - '@node-rs/argon2@2.2.1'

onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
